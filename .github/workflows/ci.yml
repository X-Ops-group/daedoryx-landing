name: Verify website
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check model.mjs
          node --check app.mjs
          node --check present.mjs
          node --check scripts/validate-site.mjs
      - name: Run calculation tests
        run: node --test tests/*.test.mjs
      - name: Check page integrity
        run: node scripts/validate-site.mjs
