name: Verify website
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check model.mjs
          node --check app.mjs
          node --check demo-policy.js
          node --check demo.js
          node --check present.mjs
          node --check scripts/validate-site.mjs
      - name: Run calculation tests
        run: node --test tests/*.test.mjs
      - name: Check page integrity
        run: node scripts/validate-site.mjs
      - name: Build offline event package
        run: node scripts/build-offline.mjs
      - name: Assert interactive offline demo is bundled
        run: |
          test -s offline/daedoryx-lab-offline.html
          grep -q 'SIMULATED' offline/daedoryx-lab-offline.html
          if grep -q 'src="demo.js"' offline/daedoryx-lab-offline.html; then exit 1; fi
      - name: Upload offline event package
        uses: actions/upload-artifact@v4
        with:
          name: daedoryx-event-offline
          path: offline/
          retention-days: 30
          if-no-files-found: error
