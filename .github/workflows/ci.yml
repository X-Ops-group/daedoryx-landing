name: Verify website
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check model.mjs
          node --check app.mjs
          node --check security.mjs
          node --check present.mjs
          node --check scripts/validate-site.mjs
          node --check scripts/build-offline.mjs
      - name: Run calculation tests
        run: node --test tests/*.test.mjs
      - name: Check page integrity
        run: node scripts/validate-site.mjs
      - name: Build offline event package
        run: node scripts/build-offline.mjs
      - name: Assert two security domains and 10 slides are bundled
        run: |
          grep -q 'securityExplorerUpdate' offline/daedoryx-landing-offline.html
          grep -q 'data-slide="9"' offline/daedoryx-presentation-offline.html
          if grep -q 'src="security.mjs"' offline/daedoryx-landing-offline.html; then exit 1; fi
      - name: Upload offline event package
        uses: actions/upload-artifact@v4
        with:
          name: daedoryx-event-offline
          path: offline/
          retention-days: 30
          if-no-files-found: error
